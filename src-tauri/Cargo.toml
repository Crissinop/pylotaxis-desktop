[package]
# Il nome del pacchetto dà il nome all'eseguibile: è uno dei punti elencati in A.2 (v0.1.0).
name = "pylotaxis"
version.workspace = true
edition.workspace = true
publish = false
description = "Portale desktop per catalogare, proteggere e avviare le proprie app"

[lib]
# Nome neutro: così main.rs non contiene il nome del prodotto (A.2), e diverso da quello
# dell'eseguibile, come richiede Windows (cargo#8519).
name = "app_lib"
# Solo rlib: staticlib e cdylib servono ai target mobile e, sul desktop, raddoppiano tempi
# e spazio della build di release. Si aggiungono quando arriverà il mobile (v0.1.0).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
domain = { path = "../crates/domain" }
# Credential Manager tramite keyring-core e il suo archivio nativo per Windows, usati solo
# lato Rust: nessun plugin espone i segreti a JavaScript (A.7.10, lezione 26). (v0.2.0)
keyring-core = "1.0.0"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.11.6", features = [] }
# Plugin ufficiali usati solo da Rust: nessuna capability ne concede i comandi al webview.
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
uuid = { version = "1.26.1", features = ["v7"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
serde_json = "1.0.151"

[lints]
workspace = true
