[package]
# Il nome del pacchetto dà il nome all'eseguibile: è uno dei punti elencati in A.2 (v0.1.0).
name = "pylotaxis"
version.workspace = true
edition.workspace = true
publish = false
description = "Portale desktop per catalogare, proteggere e avviare le proprie app"

[lib]
# Nome neutro: così main.rs non contiene il nome del prodotto (A.2), e diverso da quello
# dell'eseguibile, come richiede Windows (cargo#8519).
name = "app_lib"
# Solo rlib: staticlib e cdylib servono ai target mobile e, sul desktop, raddoppiano tempi
# e spazio della build di release. Si aggiungono quando arriverà il mobile (v0.1.0).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
domain = { path = "../crates/domain" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.11.6", features = [] }

[dev-dependencies]
serde_json = "1.0.151"

[lints]
workspace = true
