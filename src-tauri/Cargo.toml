[package]
# Il nome del pacchetto dà il nome all'eseguibile: è uno dei punti elencati in A.2 (v0.1.0).
name = "pylotaxis"
version.workspace = true
edition.workspace = true
publish = false
description = "Portale desktop per catalogare, proteggere e avviare le proprie app"

[lib]
# Nome neutro: così main.rs non contiene il nome del prodotto (A.2), e diverso da quello
# dell'eseguibile, come richiede Windows (cargo#8519).
name = "app_lib"
# Solo rlib: staticlib e cdylib servono ai target mobile e, sul desktop, raddoppiano tempi
# e spazio della build di release. Si aggiungono quando arriverà il mobile (v0.1.0).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
domain = { path = "../crates/domain" }
# Credential Manager tramite keyring-core e il suo archivio nativo per Windows, usati solo
# lato Rust: nessun plugin espone i segreti a JavaScript (A.7.10, lezione 26). (v0.2.0)
keyring-core = "1.0.0"
serde = { version = "1.0.229", features = ["derive"] }
# Configurazione dei plugin (`Config::plugins`): lo schema dei link si legge da lì (v0.5.0).
serde_json = "1.0.151"
# Icona nella tray: funzione del core di Tauri, non un plugin (v0.5.0).
tauri = { version = "2.11.6", features = ["tray-icon"] }
# Plugin ufficiali usati solo da Rust: nessuna capability ne concede i comandi al webview.
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
# Rapidità (v0.5.0), plugin usati solo da Rust: nessun pacchetto npm e nessun loro permesso
# nelle capability. Versioni stabili 2.x (le 3.0 esistono solo come alpha).
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-deep-link = "2.4.10"
# Con `deep-link` la seconda istanza consegna il link alla prima prima della callback.
tauri-plugin-single-instance = { version = "2.4.5", features = ["deep-link"] }
# Organizzazione (v0.6.0). Stato delle app web: client HTTP bloccante, senza le funzioni
# predefinite. `native-tls` su Windows è il TLS di sistema (SChannel); i certificati di sistema
# si impostano nel codice (health.rs). Porta con sé le radici Mozilla, non usate.
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }
# Avvio con Windows, usato solo da Rust. Versione esatta: la 2.6.0 richiede Tauri 2.12, un
# aggiornamento di piattaforma da fare in una versione dedicata (A.10).
tauri-plugin-autostart = "=2.5.1"
uuid = { version = "1.26.1", features = ["v7"] }

[target.'cfg(windows)'.dependencies]
# Windows Hello legato alla finestra, inattività di sistema e stato della sessione; dalla v0.4.0
# anche gli appunti privati (DataExchange, Memory, Ole). È la
# versione che Tauri usa già: nessuna seconda copia del crate, e lo stesso tipo HWND. (v0.3.0)
windows = { version = "0.61.3", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    # Icone degli eseguibili (v0.7.0).
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
] }
# Tipo delle operazioni asincrone di WinRT (attesa e annullamento del prompt di Hello).
windows-future = "0.2.1"
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
tempfile = "3.27.0"
# Runtime simulato di Tauri: i test del blocco passano dal gestore vero dei comandi (v0.3.0).
tauri = { version = "2.11.6", features = ["test"] }

[lints]
workspace = true
