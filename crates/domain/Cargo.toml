[package]
name = "domain"
version.workspace = true
edition.workspace = true
publish = false
description = "Regole e persistenza del portale, senza dipendenze da Tauri"

[dependencies]
# Impronta del PIN con Argon2id (RustCrypto). La 0.6 è la linea stabile dal 27/08/2026;
# genera il sale con getrandom 0.4, la stessa versione già usata qui sotto. (v0.3.0)
argon2 = "0.6.0"
# SQLCipher e OpenSSL compilati dai sorgenti: nessuna libreria di sistema da installare
# su Windows, a costo di una prima compilazione più lunga (v0.1.0).
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
url = "2.5.8"
# UUIDv7: ordinati nel tempo e senza collisioni anche nello stesso millisecondo (A.7.4). (v0.2.0)
uuid = { version = "1.26.1", features = ["v7"] }
getrandom = "0.4.3"
# Icone delle app (v0.7.0): codifica e verifica dei PNG. Stessa versione già nel lockfile
# (lì solo per la compilazione): nessun crate nuovo.
png = "0.17.16"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
