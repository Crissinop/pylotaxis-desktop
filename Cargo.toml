[workspace]
# Workspace alla radice: il guscio Tauri e il dominio puro compilano e si testano
# insieme con un solo `cargo test --workspace` (v0.1.0).
resolver = "3"
members = ["src-tauri", "crates/domain"]

[workspace.package]
# Versione unica dei crate: è uno dei tre manifest controllati da
# scripts/check-versions.mjs, insieme a package.json e tauri.conf.json (v0.1.0).
version = "0.3.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Niente unwrap/expect nel codice di produzione (A.7.5); nei test sono ammessi
# tramite clippy.toml (v0.1.0).
unwrap_used = "deny"
expect_used = "deny"

# I profili valgono solo alla radice del workspace: qui, non in src-tauri (v0.1.0).

# In sviluppo le dipendenze si compilano senza informazioni di debug: la cartella target
# si riduce di molto e il link è più veloce; il nostro codice resta pienamente debuggabile (v0.2.0).
[profile.dev.package."*"]
debug = false

# Argon2id con 64 MiB (A.7.4) senza ottimizzazioni impiega secondi: in sviluppo e nei test
# il PIN si verifica quasi come in release, e i test provano i parametri veri (v0.3.0).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
