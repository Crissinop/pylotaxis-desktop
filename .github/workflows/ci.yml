# CI di Pylotaxis (v0.1.0).
# Le Actions sono fissate per commit, non per tag: un tag si può spostare, un commit no.
# Il commento accanto a ogni SHA indica la versione corrispondente.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Permessi minimi: il workflow legge il codice e non scrive nulla nel repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verifiche (Windows)
    # Stesso sistema operativo dell'utente: è qui che si prova SQLCipher su Windows.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Installa la versione di Rust fissata in rust-toolchain.toml, con rustfmt e clippy.
      - name: Rust da rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # OpenSSL (dentro SQLCipher) si compila con un Perl nativo per Windows: lo si
      # controlla subito, così un errore di ambiente non sembra un errore del codice.
      - name: Prerequisiti di compilazione
        shell: pwsh
        run: |
          perl -v | Select-Object -First 2
          rustc --version
          cargo --version
          node --version

      - run: npm ci

      - name: npm run verify
        run: npm run verify

  audit:
    name: Audit delle dipendenze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-audit

      - name: Rust da rust-toolchain.toml
        run: rustup toolchain install

      # Fallisce sulle vulnerabilità note (RustSec). I crate non mantenuti compaiono come
      # avvisi: non bloccano, si leggono nel log e si riportano nella consegna (A.6 n. 15).
      - name: cargo audit
        run: cargo audit

      - name: npm audit
        run: npm audit --audit-level=high

  build:
    name: Build di release (Windows)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Rust da rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: npm ci

      - name: npm run tauri build
        run: npm run tauri build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
